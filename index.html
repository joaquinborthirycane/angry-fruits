<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angry Fruits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="Panel de juego">
        <div>
          <h1>Angry Fruits</h1>
          <p>Arrastra la fruta en la cuchara y sueltala contra las verduras.</p>
        </div>
        <div class="score-board">
          <span class="score-label">Puntos</span>
          <strong id="score">0</strong>
        </div>
        <button id="resetButton" class="reset-button" type="button">Reiniciar</button>
      </section>

      <section class="stage-wrap" aria-label="Escenario de Angry Fruits">
        <canvas id="gameCanvas"></canvas>
        <div id="message" class="message">Prepara la cuchara</div>
      </section>

      <section class="fruit-tray" aria-label="Frutas disponibles">
        <div class="fruit-card active" data-fruit="banana">🍌 <span>Banana</span></div>
        <div class="fruit-card" data-fruit="mandarina">🍊 <span>Mandarina</span></div>
        <div class="fruit-card" data-fruit="manzana">🍎 <span>Manzana</span></div>
        <div class="fruit-card" data-fruit="pera">🍐 <span>Pera</span></div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
    <script type="module" src="src/game.js"></script>
  </body>
</html>
