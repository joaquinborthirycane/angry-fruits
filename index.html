<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://zyyiohtocfbsuhdmauyg.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Super Frutas al Rescate. by Codo77</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"

  <body class="start-page">
    <main class="start-screen">
      <div class="start-sun" aria-hidden="true"></div>
      <div class="start-storm" aria-hidden="true"></div>

      <section class="start-copy" aria-labelledby="gameTitle">
        <p class="start-kicker">by Codo77</p>
        <h1 id="gameTitle">Super Frutas<br />al Rescate</h1>
        <p class="start-subtitle">¡Prepara la catapulta y rescata el reino frutal!</p>
        <a class="play-button" href="game.html">Jugar</a>
      </section>

      <section class="start-ranking leaderboard-panel" aria-labelledby="rankingTitle">
        <h2 id="rankingTitle">Top 10</h2>
        <ol id="homeLeaderboard" class="leaderboard-list" aria-live="polite">
          <li class="leaderboard-status">Cargando ranking...</li>
        </ol>
      </section>

      <div class="start-fruits" aria-hidden="true">
        <span class="start-fruit fruit-banana">🍌</span>
        <span class="start-fruit fruit-orange">🍊</span>
        <span class="start-fruit fruit-apple">🍎</span>
        <span class="start-fruit fruit-pear">🍐</span>
        <span class="start-fruit fruit-watermelon">🍉</span>
        <span class="start-fruit fruit-grapes">🍇</span>
      </div>

      <div class="start-cliff" aria-hidden="true"></div>
      <div class="start-enemies" aria-hidden="true">
        <span>🥦</span><span>🥕</span><span>🍆</span>
      </div>
    </main>
    <script type="module" src="src/home.js?v=20261018-2"></script>
