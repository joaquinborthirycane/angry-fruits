<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Super Frutas al Rescate. by Codo77</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20261102-24" />
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="Panel de juego">
        <div>
          <h1>Super Frutas al Rescate</h1>
          <p class="byline">by Codo77</p>
          <p>Elige una fruta, estira la catapulta y sueltala contra las verduras.</p>
        </div>
        <div class="score-board">
          <span class="score-label">Puntos</span>
          <strong id="score">0</strong>
        </div>
        <div class="level-board" aria-label="Nivel actual">
          <span>Nivel</span>
          <strong id="level">1</strong>
        </div>
        <div class="lives-board" aria-label="Vidas restantes">
          <span>Vidas</span>
          <strong id="lives">♥♥♥</strong>
        </div>
        <button id="replayButton" class="replay-button" type="button" disabled>Repetir tiro</button>
        <a id="headerHomeButton" class="header-home-button" href="index.html" aria-label="Volver a la página de inicio">🏠 Inicio</a>
        <button id="resetButton" class="reset-button" type="button">Reiniciar</button>
      </section>

      <section class="stage-wrap" aria-label="Escenario de Super Frutas al Rescate">
        <canvas id="gameCanvas"></canvas>
        <div class="world-scenery" aria-hidden="true"></div>
        <div id="weatherLayer" class="weather-layer" aria-hidden="true"></div>
        <div id="worldIntro" class="world-intro" aria-live="polite"></div>
        <div id="message" class="message">Elige una fruta</div>
        <div id="weatherIndicator" class="weather-indicator" aria-live="polite">☀️ Calma</div>
      </section>

      <section class="fruit-tray" aria-label="Frutas disponibles">
        <button class="fruit-card active" data-fruit="banana" type="button">🍌 <span>Banana</span></button>
        <button class="fruit-card" data-fruit="mandarina" type="button">🍊 <span>Mandarina</span></button>
        <button class="fruit-card" data-fruit="manzana" type="button">🍎 <span>Manzana</span></button>
        <button class="fruit-card" data-fruit="pera" type="button">🍐 <span>Pera</span></button>
        <button class="fruit-card locked" data-fruit="sandia" type="button">🔒 <span>Sandia</span></button>
        <button class="fruit-card locked" data-fruit="uvas" type="button">🔒 <span>Uvas</span></button>
        <button class="fruit-card locked" data-fruit="dragon" type="button">🔒 <span>Dragon</span></button>
        <button class="fruit-card locked" data-fruit="melon" type="button">🔒 <span>Melon de Fuego</span></button>
        <button class="fruit-card locked" data-fruit="fresa" type="button">🔒 <span>Fresa</span></button>
        <button class="fruit-card locked" data-fruit="naranja" type="button">🔒 <span>Naranja de Zumo</span></button>
      </section>
    </main>

    <dialog id="gameOverDialog" class="game-over-dialog">
      <div class="game-over-content">
        <p class="dialog-kicker">Fin de la partida</p>
        <h2>¡Gran lanzamiento!</h2>
        <p class="final-score">Conseguiste <strong id="finalScore">0</strong> puntos</p>
        <a class="home-button" href="index.html">Volver al inicio</a>
      </div>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
    <script type="module" src="src/game.js?v=20261102-47"></script>
  </body>
</html>
